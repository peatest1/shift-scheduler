<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบจัดเวรพนักงานแก้กระแสไฟฟ้าขัดข้อง</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand"><span class="brand-mark"></span><h1 style="font-size:18px;">ระบบจัดเวร กฟภ.</h1></div>
      <p class="auth-sub">จัดเวรพนักงานแก้ไขกระแสไฟฟ้าขัดข้อง</p>

      <div class="tab-row">
        <button class="tab-btn active" id="tabLoginBtn">เข้าสู่ระบบ</button>
        <button class="tab-btn" id="tabRegisterBtn">สมัครสมาชิก</button>
      </div>

      <div id="msgBox"></div>

      <form id="loginForm">
        <div class="field"><label>อีเมล</label><input type="email" id="loginEmail" required></div>
        <div class="field"><label>รหัสผ่าน</label><input type="password" id="loginPassword" required></div>
        <button class="btn btn-primary" type="submit">เข้าสู่ระบบ</button>
      </form>

      <form id="registerForm" style="display:none;">
        <div class="field">
          <label>รหัสพนักงาน</label>
          <input type="text" id="regEmpId" placeholder="เช่น 501398" required>
        </div>
        <div class="field"><label>อีเมลที่ใช้เข้าสู่ระบบ</label><input type="email" id="regEmail" required></div>
        <div class="field"><label>ตั้งรหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label><input type="password" id="regPassword" minlength="6" required></div>
        <div class="checkbox-row">
          <input type="checkbox" id="regIsAdmin">
          <label for="regIsAdmin" style="margin:0;">สมัครเป็นแอดมิน (ต้องมีรหัสตั้งค่าระบบ)</label>
        </div>
        <div class="field" id="adminKeyField" style="display:none;">
          <label>รหัสตั้งค่าระบบ (Admin setup key)</label>
          <input type="password" id="regAdminKey">
        </div>
        <button class="btn btn-primary" type="submit">สมัครสมาชิก</button>
        <p class="auth-sub" style="margin-top:12px;">* พนักงานทั่วไปต้องให้แอดมินเพิ่มชื่อ-รหัสพนักงานในระบบก่อน จึงจะสมัครสมาชิกผูกกับรหัสพนักงานนั้นได้</p>
      </form>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
